# Memoire allouee a Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom n'est pas compatible avec le configuration cache
org.gradle.configuration-cache=false

# Versions Minecraft / Fabric (voir https://fabricmc.net/develop)
# Minecraft 26.x est livre non obfusque : pas de mappings, plugin fabric-loom classique, Java 25.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.1.2

# Tests
junit_version=5.11.4

# Proprietes du mod
mod_version=0.1.0
maven_group=fr.tomda
archives_base_name=mcbridge
